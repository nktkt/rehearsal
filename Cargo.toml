[package]
name = "rehearsal"
version = "0.1.0"
edition = "2024"
description = "Rehearse your SQLite recovery. Restore, verify, and keep the evidence."
license = "MIT"
keywords = ["sqlite", "backup", "restore", "cli"]
categories = ["command-line-utilities", "database"]
readme = "README.md"
repository = "https://github.com/nktkt/rehearsal"
exclude = [".github/", "dist/", "scripts/", "rehearsal-demo/", "rehearsal-broken-demo/", ".rehearsal/"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
humantime = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "extra_check"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

[profile.release]
lto = "thin"
strip = true
